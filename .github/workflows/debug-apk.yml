name: Debug APK build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APKs
        run: >-
          ./gradlew --no-daemon
          :system-module:assembleDebug
          :protocol-test:assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: hyperears-debug-apks
          path: |
            system-module/build/outputs/apk/debug/*.apk
            protocol-test/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
